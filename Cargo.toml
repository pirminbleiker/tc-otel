[workspace]
members = [
    "crates/tc-otel-core",
    "crates/tc-otel-ads",
    "crates/tc-otel-client",
    "crates/tc-otel-export",
    "crates/tc-otel-service",
    "crates/tc-otel-benches",
    "crates/tc-otel-integration-tests",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["tc-otel Contributors"]
license = "Apache-2.0"
repository = "https://github.com/pirminbleiker/tc-otel"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# OTLP protobuf — message types from opentelemetry-proto (0.31 line)
# pulls prost 0.14 + tonic 0.14. The inbound gRPC LogsServiceServer in
# tc-otel-export/src/grpc.rs keeps its hand-rolled prost types so the
# workspace is not entirely tied to opentelemetry-proto's release cadence.
tonic = "0.14"
tonic-build = "0.14"
prost = "0.14"
prost-types = "0.14"
opentelemetry-proto = { version = "0.31", default-features = false, features = [
    "gen-tonic-messages",
    "trace",
    "metrics",
    "logs",
] }

# HTTP/Web
axum = "0.8"
hyper = "1.0"
hyper-util = "0.1"
http = "1.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Internal crates
tc-otel-core = { path = "crates/tc-otel-core" }
tc-otel-ads = { path = "crates/tc-otel-ads" }
tc-otel-client = { path = "crates/tc-otel-client" }
tc-otel-export = { path = "crates/tc-otel-export" }
tc-otel-service = { path = "crates/tc-otel-service" }

# Utilities
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
bytes = "1.5"
parking_lot = "0.12"
gethostname = "1.1"
# Used to enumerate local interface IPs for OTel sem-conv `source.address`
# without relying on a default-route / Internet UDP-connect probe.
if-addrs = "0.13"

# Testing
mockall = "0.14"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
